name: Build Windows executable

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write          # needed to attach the .exe to a release

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Import check
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -c "import nandtrack.app, nandtrack.ui.main_window; print('imports ok')"

      - name: Draw the application icon
        env:
          QT_QPA_PLATFORM: offscreen
        run: python make_icon.py

      - name: Package with PyInstaller
        run: pyinstaller nandtrack.spec --noconfirm --clean

      - name: Report the size
        run: |
          $exe = Get-Item dist\NANDTrack.exe
          "NANDTrack.exe - {0:N1} MB" -f ($exe.Length / 1MB)

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: NANDTrack-windows-x64
          path: dist/NANDTrack.exe
          retention-days: 30
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/NANDTrack.exe
          generate_release_notes: true
